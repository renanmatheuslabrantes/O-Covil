<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Covil</title>
    <link rel="icon" type="image/jpeg" href="images/nwdb-logo.jpeg">
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="admin-page">
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">O Covil</a>
            <button id="logout-button" class="cta-button admin-logout" type="button" hidden>Sair</button>
        </div>
    </header>

    <main class="admin-main container">
        <section id="login-panel" class="admin-panel">
            <h1>Painel do Covil</h1>
            <form id="login-form" class="admin-form">
                <label for="login-username">Login</label>
                <input id="login-username" type="text" autocomplete="username" required>
                <label for="login-password">Senha</label>
                <input id="login-password" type="password" autocomplete="current-password" required>
                <button class="cta-button" type="submit">Entrar</button>
            </form>
        </section>

        <section id="content-panel" hidden>
            <div id="admin-message" class="admin-message" role="status"></div>

            <div class="admin-grid">
                <section class="admin-panel">
                    <h2>Novo post</h2>
                    <form id="post-form" class="admin-form">
                        <label for="post-title">Título</label>
                        <input id="post-title" name="titulo" maxlength="120" required>
                        <label for="post-summary">Descrição do card</label>
                        <textarea id="post-summary" name="resumo" rows="3" maxlength="280" placeholder="Resumo breve para exibir na página inicial" required></textarea>
                        <label id="post-content-label">Conteúdo</label>
                        <div id="post-editor-toolbar" class="rich-text-toolbar" role="toolbar" aria-label="Formatação do conteúdo">
                            <button type="button" data-editor-command="bold" aria-label="Negrito" title="Negrito"><strong>B</strong></button>
                            <button type="button" data-editor-command="italic" aria-label="Itálico" title="Itálico"><em>I</em></button>
                            <button type="button" data-editor-command="underline" aria-label="Sublinhado" title="Sublinhado"><u>U</u></button>
                            <button type="button" data-editor-command="insertUnorderedList" aria-label="Lista com marcadores" title="Lista com marcadores">Lista</button>
                            <button type="button" data-editor-command="insertOrderedList" aria-label="Lista numerada" title="Lista numerada">1. Lista</button>
                            <button type="button" data-editor-link aria-label="Inserir link" title="Inserir link">Link</button>
                        </div>
                        <div id="post-content" class="rich-text-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-required="true" aria-labelledby="post-content-label" data-placeholder="Escreva o conteúdo da publicação..."></div>
                        <input id="post-content-value" type="hidden" name="conteudo">
                        <div id="post-content-count" class="rich-text-count" aria-live="polite">0 / 5000</div>
                        <label for="post-image">Imagem (JPG, PNG ou WebP; até 5 MB)</label>
                        <input id="post-image" name="imagem" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required>
                        <button class="cta-button" type="submit">Publicar post</button>
                    </form>
                </section>

                <section class="admin-panel">
                    <h2>Nova foto no carrossel</h2>
                    <form id="carousel-form" class="admin-form">
                        <label for="carousel-caption">Legenda (opcional)</label>
                        <input id="carousel-caption" name="legenda" maxlength="160">
                        <label for="carousel-link">Link ao clicar (opcional)</label>
                        <input id="carousel-link" name="link" type="url" placeholder="https://...">
                        <label for="carousel-image">Imagem (JPG, PNG, WebP ou GIF; até 5 MB)</label>
                        <input id="carousel-image" name="imagem" type="file" accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif" required>
                        <button class="cta-button" type="submit">Adicionar ao carrossel</button>
                    </form>
                </section>
            </div>

            <section id="profile-panel" class="admin-panel admin-list-panel">
                <h2>Meu perfil</h2>
                <form id="profile-form" class="admin-form">
                    <label for="profile-display-name">Nome público</label>
                    <input id="profile-display-name" name="displayName" maxlength="80" required>
                    <label for="profile-description">Sobre mim</label>
                    <textarea id="profile-description" name="description" rows="4" maxlength="500" placeholder="Escreva uma breve apresentação"></textarea>
                    <label for="profile-avatar">Foto de perfil (JPG, PNG ou WebP; até 5 MB)</label>
                    <input id="profile-avatar" name="avatar" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
                    <img id="profile-avatar-preview" class="profile-avatar-preview" alt="Prévia da foto de perfil" hidden>
                    <label class="profile-clear-option"><input id="profile-clear-avatar" type="checkbox"> Remover foto atual</label>
                    <button class="cta-button" type="submit">Salvar perfil</button>
                </form>
            </section>

            <section id="accounts-panel" class="admin-panel admin-list-panel" hidden>
                <h2>Contas do painel</h2>
                <form id="account-form" class="admin-form">
                    <label for="account-login">Usuário</label>
                    <input id="account-login" name="login" autocomplete="off" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required>
                    <label for="account-password">Senha inicial (mínimo de 12 caracteres)</label>
                    <input id="account-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                    <label for="account-role">Perfil</label>
                    <select id="account-role" name="role" required>
                        <option value="journalist">Jornalista</option>
                        <option id="account-admin-option" value="admin" hidden>Administrador</option>
                    </select>
                    <button class="cta-button" type="submit">Criar conta</button>
                </form>
                <div id="accounts-list" class="admin-list"></div>
            </section>

            <section class="admin-panel admin-list-panel">
                <h2>Posts publicados</h2>
                <div id="posts-list" class="admin-list"></div>
            </section>

            <section id="news-panel" class="admin-panel admin-list-panel">
                <h2>Notícias publicadas</h2>
                <div id="news-list" class="admin-list"></div>
            </section>

            <section class="admin-panel admin-list-panel">
                <h2>Fotos do carrossel</h2>
                <div id="carousel-list" class="admin-list"></div>
            </section>
        </section>
    </main>

    <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
